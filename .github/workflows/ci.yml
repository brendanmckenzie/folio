name: ci

# Pull requests only, with read permissions and no secrets. This repository is
# public, so a fork PR runs here: nothing in this file may use
# pull_request_target, a self-hosted runner, or a secret. Merging to main is gated
# by `gate` (a ruleset requires it), so main is not tested a second time.
on:
  pull_request:

# A newer push to the same PR replaces its in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: biome, typecheck, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The root `prepare` script builds the library here as a side effect.
      - run: pnpm install --frozen-lockfile

      # Gate on exit codes, not output: `biome ci` prints "No issues found" even
      # when its format check failed (see CLAUDE.md), and Actions fails the step
      # on the exit code alone.
      - name: biome
        run: pnpm lint

      # worker-configuration.d.ts is gitignored; examples/demo does not typecheck
      # without it.
      - name: generate Worker types
        run: pnpm --filter demo cf-typegen

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Unit tests in Node plus the workers project in real workerd.
      - name: test
        run: pnpm test

  # Server half of the commit convention: the squash commit subject is the PR
  # title, so the title is linted with the same config as the commit-msg hook. The
  # title reaches the shell through an env var, never a template expansion.
  pr-title:
    name: pr title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No build needed to lint a string.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          ./node_modules/.bin/commitlint --edit "$RUNNER_TEMP/pr-title.txt"

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch a pinned release into the job's temp dir and check it against its
      # published sha256 first.
      - name: install actionlint
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint"
          mkdir -p "$d"
          curl -fsSL -o "$d/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $d/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$d/actionlint.tar.gz" -C "$d" actionlint
          echo "$d" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: the scan walks the commits in the range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The CLI, not gitleaks-action, which needs a paid licence for organisations.
      - name: install gitleaks
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"
          mkdir -p "$d"
          curl -fsSL -o "$d/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $d/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$d/gitleaks.tar.gz" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"

      # A PR scans its own commits.
      - name: scan the commit range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks detect --redact --verbose --log-opts="$PR_BASE..$PR_HEAD"

  # The one status a ruleset requires. Every job above must pass.
  gate:
    if: always()
    needs: [check, pr-title, workflows, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needed job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) echo "::error::a required job failed, was cancelled or was skipped"; exit 1 ;;
          esac
