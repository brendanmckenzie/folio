name: ci

# Pull requests only, with read permissions and no secrets. This repository is
# public, so a fork PR runs here: nothing in this file may use
# pull_request_target or a self-hosted runner, and the only job that may use a
# secret is `evals`, which runs for same-repo PRs only. Merging to main is gated
# by `gate` (a ruleset requires it), so main is not tested a second time.
on:
  pull_request:
    # `edited` so a retitled PR re-runs `pr-title`; a re-run reuses the old payload.
    types: [opened, synchronize, reopened, edited]

# A newer push to the same PR replaces its in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: biome, typecheck, build, test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The root `prepare` script builds the library here as a side effect.
      - run: pnpm install --frozen-lockfile

      # Gate on exit codes, not output: `biome ci` prints "No issues found" even
      # when its format check failed (see CLAUDE.md), and Actions fails the step
      # on the exit code alone.
      - name: biome
        run: pnpm lint

      # worker-configuration.d.ts is gitignored; examples/demo does not typecheck
      # without it.
      - name: generate Worker types
        run: pnpm --filter demo cf-typegen

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      # Unit tests in Node plus the workers project in real workerd.
      - name: test
        run: pnpm test

  # The cheap checks in one job, so a run pays one runner start and one checkout instead of
  # four. Every step runs even when an earlier one failed, so one run reports every finding.
  # The PR title is the server half of the commit convention (squash_merge_commit_title:
  # PR_TITLE), linted with the same config as the commit-msg hook. It reaches the shell
  # through an env var, never a template expansion.
  lint:
    name: lint (title, actionlint, zizmor, gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Full history: the scan walks the commits in the range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fetch a pinned release into the job's temp dir and check it against its
      # published sha256 first.
      - name: install actionlint
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint"
          mkdir -p "$d"
          curl -fsSL -o "$d/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $d/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$d/actionlint.tar.gz" -C "$d" actionlint
          echo "$d" >> "$GITHUB_PATH"

      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint -color

      - name: install zizmor
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/zizmor"
          mkdir -p "$d"
          curl -fsSL -o "$d/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  $d/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$d/zizmor.tar.gz" -C "$d" zizmor
          echo "$d" >> "$GITHUB_PATH"

      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows

      # The CLI, not gitleaks-action, which needs a paid licence for organisations.
      - name: install gitleaks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"
          mkdir -p "$d"
          curl -fsSL -o "$d/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $d/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$d/gitleaks.tar.gz" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"

      # A PR scans its own commits.
      - name: scan the commit range
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks detect --redact --verbose --log-opts="$PR_BASE..$PR_HEAD"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No build needed to lint a string.
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-scripts
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}

      - name: lint the PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          ./node_modules/.bin/commitlint --edit "$RUNNER_TEMP/pr-title.txt"

  # Which LLM tasks does this PR touch? Only a registry entry, a task's prompt or tools file,
  # its eval directory or its model's price marks one; a dependency bump marks nothing, so it
  # spends no eval money.
  changes:
    name: changes (llm tasks)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      llm: ${{ steps.llm.outputs.llm }}
      llm_tasks: ${{ steps.llm.outputs.llm_tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: llm
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/llm-changes.mjs "$PR_BASE" "$PR_HEAD"

  # The second job allowed a secret on `pull_request` (the other is none: `check` has no secrets).
  # Same-repo PRs only: a fork PR gets no secret, so the job is skipped and `gate` accepts that.
  # It runs the suite with the model the registry names and compares with the suite's
  # baseline.json, so a model, prompt or tools change cannot merge on a worse score. A missing
  # key fails the job rather than skipping the check.
  evals:
    name: llm evals
    needs: changes
    if: ${{ needs.changes.outputs.llm == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_KEY }}
      LLM_TASKS: ${{ needs.changes.outputs.llm_tasks }}
    steps:
      - name: the eval key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_EVAL_KEY is empty, so the evals did not run"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The harness bundles src/server/describe-anthropic.ts itself, so no library build.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: run the evals
        run: node scripts/llm/eval.mjs --gate --tasks "$LLM_TASKS" --max-usd 2.00

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: eval-out
          path: eval-out
          if-no-files-found: ignore

  # The one status a ruleset requires. Every job above must pass.
  gate:
    if: always()
    needs: [check, lint, evals]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every needed job passed
        env:
          CHECK: ${{ needs.check.result }}
          LINT: ${{ needs.lint.result }}
          EVALS: ${{ needs.evals.result }}
        run: |
          echo "check=$CHECK lint=$LINT evals=$EVALS"
          # `check` and `lint` must succeed. `evals` is the one job that may be skipped: it is
          # skipped when no LLM task changed and on a fork PR, which gets no secret. A failed or
          # cancelled `evals` still fails the gate.
          if [ "$CHECK" != success ] || [ "$LINT" != success ]; then
            echo "::error::check or lint did not succeed"
            exit 1
          fi
          case "$EVALS" in
            success|skipped) ;;
            *) echo "::error::evals did not pass ($EVALS)"; exit 1 ;;
          esac
