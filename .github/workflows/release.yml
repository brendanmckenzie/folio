name: release

# A pushed vX.Y.Z tag. The commits are already on main (consumers pin a SHA from
# there); the tag gives one of those SHAs a name, so this workflow runs every gate
# against the tagged commit and then creates the GitHub Release.
#
# The gates are independent, so they run on separate runners at once and the
# `release` job needs every one of them: a failed or cancelled gate skips it, and
# a skipped job creates nothing. They are separate runners rather than parallel
# processes on one because the workers test project (real workerd) starves under
# load and fails as `Timeout starting cloudflare-pool runner`, and the end-to-end
# sweep is exactly that load. See `--stage` in scripts/release.mjs.
#
# workflow_dispatch is a dry run: it names a tag, runs the same gates on the ref
# it was started from, and creates nothing. Run it on main after bumping
# package.json and before pushing the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to rehearse, e.g. v1.0.0 (must equal package.json version)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The tag names this commit and this package.json, sits on main and has not moved,
  # and the ledger has its entry. No dependencies, so it fails in seconds.
  verify:
    name: verify the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      # Full history, so the check can see the tag sits on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # GH_TOKEN authenticates the one `git ls-remote` that reads the remote tag,
      # since checkout does not persist credentials.
      - run: node scripts/release.mjs --tag --ci --stage=verify
        env:
          GH_TOKEN: ${{ github.token }}

  # Unit tests in Node plus the workers project in real workerd, alone on its runner.
  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # A release job publishes, so it never restores a cache a PR run could
          # have written.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # gitignored, and examples/demo does not typecheck without it.
      - name: generate Worker types
        run: pnpm --filter demo cf-typegen

      - run: node scripts/release.mjs --tag --ci --stage=tests

  # Biome and typecheck.
  static:
    name: biome, typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: generate Worker types
        run: pnpm --filter demo cf-typegen

      - run: node scripts/release.mjs --tag --ci --stage=static

  # The end-to-end sweep: 26 scripts, several at a time, each with its own dev
  # server, port and state directory (scripts/e2e-all.sh).
  e2e:
    name: end-to-end sweep
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # scripts/e2e.sh is a zsh script.
      - name: install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - run: pnpm install --frozen-lockfile

      - run: node scripts/release.mjs --tag --ci --stage=e2e

  # The packed install in a temp directory, the way a consumer runs it. It installs
  # the repository with npm, so it needs no workspace install.
  smoke:
    name: consumer smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Full history: the install is `git+file:` against this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: node scripts/release.mjs --tag --ci --stage=smoke

  release:
    name: create the release
    needs: [verify, tests, static, e2e, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Only this job creates the Release, and only on a tag push.
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
