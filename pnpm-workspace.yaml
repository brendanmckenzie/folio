packages:
  - .
  - examples/*

# Refuse any release younger than three days (minutes), matching Renovate's
# minimumReleaseAge. A compromised release is usually caught within that window.
minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: @tiptap/core@3.30.5
  - "@tiptap/core@3.30.5"
  # Renovate security update: hono@4.13.7 || 4.13.11
  - hono@4.13.7 || 4.13.11
  # Renovate security update: vite@8.1.6
  - vite@8.1.6
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
